name: Deploy React Website to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Packages
        run: npm install --legacy-peer-deps

      - name: Build React App
        run: npm run build

      - name: Upload build to Hostinger
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          test -s build/index.html
          test -s build/_seo/pricing.html

          cd build
          upload() {
            curl --silent --show-error --fail --ftp-create-dirs \
              --connect-timeout 15 --max-time 90 --retry 3 --retry-all-errors \
              --user "$FTP_USERNAME:$FTP_PASSWORD" --upload-file "$1" \
              "ftp://$FTP_SERVER:21//public_html/$1"
          }

          while IFS= read -r -d '' file; do
            upload "${file#./}"
          done < <(find . -type f ! -path ./index.html ! -path ./.htaccess -print0)
          upload index.html
          upload .htaccess

      - name: Verify public pages
        run: |
          curl --fail --silent --show-error --location --retry 3 https://au-someteacher.com/ | grep -qi 'Au-Some Teacher'
          curl --fail --silent --show-error --location --retry 3 https://au-someteacher.com/pricing | grep -qi 'supervision pricing'

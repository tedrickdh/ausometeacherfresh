*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#1b2943;font:16px/1.65 system-ui,Arial}header{background:#142341;color:white;padding:14px 22px;display:flex;gap:14px;align-items:center}header img{width:66px;height:66px;object-fit:contain;background:white;border-radius:12px}header b{font-size:19px}.wrap{max-width:1020px;margin:auto;padding:22px}.panel{background:white;border:1px solid #dce4ec;border-radius:18px;padding:26px;margin-bottom:18px}h1{font-size:clamp(27px,4vw,40px);line-height:1.2}h2{line-height:1.3}button{border:0;border-radius:10px;padding:12px 18px;background:#087e88;color:white;font:inherit;font-weight:650;cursor:pointer;margin:5px}button.alt{background:#e8edf5;color:#142341}button:focus-visible,textarea:focus-visible{outline:3px solid orange}button.choice{display:block;width:100%;text-align:left;background:#f4f6fa;color:#142341;border:2px solid #dce4ec}button.choice.sel{border-color:#087e88;background:#e5f5f5}.modules{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.module{background:#edf5f6;border-radius:12px;padding:14px;text-align:left;color:#142341}.pill{color:#087e88;font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:12px}textarea{width:100%;min-height:110px;padding:12px;border:1px solid #b9c7d7;border-radius:9px;font:inherit}.bar{height:9px;background:#dce4ec;border-radius:10px;overflow:hidden}.bar div{height:100%;background:#087e88}.notice{border-left:4px solid #6944b5;padding:12px 15px;background:#f3f0fb;margin:15px 0}footer{font-size:13px;color:#566579;padding:15px 0}@media(max-width:600px){.wrap{padding:12px}.panel{padding:18px}header img{width:48px;height:48px}}</style></head><body><header><img src="https://customer-assets.emergentagent.com/job_9999b4e2-e562-4f7d-b65c-b27bad5fffb6/artifacts/7m2ruj3w_brain-with-pencil1.png" alt="Au-Some Teacher brain with pencil logo"><div><b>Au-Some Teacher ABA Services</b><div>Professional Learning Academy · Unlisted course</div></div></header><main class="wrap" id="app"></main><script>
const modules=[["Foundations of Ethical ABA",["Client dignity and welfare","Ethical decision framework","RBT and BCBA responsibilities","Assent and client communication","Recognizing scope limits","Reflection and checkpoint"]],["Understanding Behavior in Context",["Observation versus interpretation","Antecedent–behavior–consequence","Function as a hypothesis","Setting events and environment","Evidence-based response","Reflection and checkpoint"]],["Culture, Identity, and Family Partnership",["Cultural humility","Listening to caregivers","Identity, hair, and sensory preferences","Socially valid goals","Repairing communication","Reflection and checkpoint"]],["Clinical Documentation and Data Integrity",["Why documentation matters","Objective session notes","Missing data dilemma","Copy-paste risks","Confidentiality and records","Reflection and checkpoint"]],["Supervision and Professional Boundaries",["Active supervision","RBT scope and BCBA responsibilities","Giving and receiving feedback","Conflicting instructions","Escalating concerns","Reflection and checkpoint"]],["Applied Decision-Making Challenge",["Meet the fictional client team","Review the evidence","Choose a response","Communicate and document","Final assessment preparation","Transfer-to-practice plan"]]],lessons=[["Prioritize client welfare, rights, dignity, and individualized care.","Check safety, evidence, scope, consent/assent, and whom to consult.","RBTs implement supervised plans; BCBAs assess, design, revise, and supervise within competence.","Honor communication and follow individualized safety and supervisory guidance.","Do not independently change clinical treatment plans outside your role.","Write one concrete ethical action you will use."],["Describe what happened rather than guessing intent.","ABC observations help reveal patterns, but do not prove function.","Behavioral function is a hypothesis requiring suitable assessment.","Sleep, sensory context, demands, communication access, and rapport may matter.","Follow authorized plans and bring concerns to supervisors.","Separate one observable fact from one interpretation."],["Ask about values and experiences rather than assuming.","Caregivers and clients contribute meaningful priorities and expertise.","Respect cultural practices, identity, autonomy, and individual preferences.","Prioritize meaningful goals and social validity.","Acknowledge concerns and collaborate with the responsible clinician.","Identify one way to invite client or family input."],["Accurate records support care, decisions, and accountability.","Write observable facts, context, and data rather than judgmental labels.","Never fabricate missing measurements; report gaps transparently.","Do not copy notes that misrepresent services or outcomes.","Use authorized systems and appropriate privacy safeguards.","Rewrite a subjective statement objectively."],["Supervision includes feedback, observation, and skill development.","RBTs need oversight; BCBAs must work within competence.","Make feedback specific, respectful, and actionable.","Clarify conflicting directions and prioritize client welfare.","Report factual concerns through appropriate channels.","Name one question to bring to supervision."],["Review the fictional case before making decisions.","Compare ABC observations, family input, and documented data.","Choose a safe, ethical, role-appropriate response.","Practice objective documentation and respectful communication.","Review the five competency domains before the exam.","Set a specific transfer-to-practice goal."]],questions=[["Who may independently revise a treatment plan?",["An RBT","The supervising qualified clinician","Any caregiver","Any team member"],1],["A client says stop during a nonessential activity. Best response?",["Ignore it","Acknowledge communication and follow individualized guidance","Increase demands","Assume defiance"],1],["Which is observable?",["Lazy","Manipulative","Pushed materials off the table","Attention seeking"],2],["ABC data from one event can:",["Prove function","Suggest a hypothesis","Diagnose","Replace assessment"],1],["What should an RBT do with a caregiver's treatment concern?",["Dismiss it","Change the goal","Share it with the BCBA","Stop all services"],2],["Which practice reflects cultural humility?",["Assume preferences","Ask and listen respectfully","Ignore family values","Use one approach for everyone"],1],["A meaningful goal should:",["Fit client priorities","Be easiest to score","Be chosen only by staff","Look impressive"],0],["What if 15 minutes of data are missing?",["Estimate","Copy yesterday","Document the gap and notify supervisor","Invent zeros"],2],["Which note is objective?",["Client was rude","Client refused because lazy","Client said no and turned away","Client was difficult"],2],["Copying a previous note is acceptable when:",["It saves time","It accurately represents today's actual session","The supervisor is busy","Never checking details"],1],["How should identifiable client data be shared?",["Public chat","Approved channels with authorized people","Social media","Personal group text"],1],["When asked to work outside competence, a BCBA should:",["Proceed regardless","Seek training, consultation, or referral","Delegate without oversight","Ignore concern"],1],["Helpful feedback is:",["Specific and actionable","Personal criticism","Vague","Only negative"],0],["If instructions conflict with the plan, an RBT should:",["Change the plan secretly","Clarify with supervisor","Guess","Ignore"],1],["A client needs a communication device. Priority?",["Remove it","Support communication access","Ignore attempts","Assume no preferences"],1],["What can affect behavior?",["Sleep","Task demands","Sensory environment","All of these"],3],["When a caregiver raises a cultural concern, staff should:",["Dismiss it","Listen and consult the responsible clinician","Punish disagreement","Change goals independently"],1],["Which is an inference?",["Stood up","Yelled","Was seeking attention","Left table"],2],["When asked for data you did not collect:",["Invent values","Disclose missing data","Borrow values","Use estimates as facts"],1],["Ethical decisions should consider:",["Convenience only","Instinct only","Welfare, evidence, role, and consultation","Speed only"],2]];
let state={page:0,done:[],notes:{},answers:{},attempts:0,score:null};try{state={...state,...JSON.parse(localStorage.getItem("ast_training_v1")||"{}")}}catch(e){}
const app=document.getElementById("app"),esc=x=>String(x).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));function save(){localStorage.setItem("ast_training_v1",JSON.stringify(state))}function render(h){app.innerHTML=h;window.scrollTo(0,0)}function home(){render('<section class="panel"><span class="pill">Self-paced professional learning</span><h1>Beyond the Behavior Plan</h1><p>Ethical Decisions, Clinical Judgment &amp; Culturally Responsive ABA</p><p>6 modules · 36 learning screens · 20-question final assessment · 80% passing score</p><div class="bar"><div style="width:'+(state.done.length/36*100)+'%"></div></div><p>'+state.done.length+' of 36 screens completed on this device.</p><div class="modules">'+modules.map((m,i)=>'<button class="module" onclick="lesson('+(i*6)+')">Module '+(i+1)+'<br><b>'+esc(m[0])+'</b></button>').join('')+'</div><p><button onclick="lesson('+state.page+')">Start or resume →</button><button class="alt" onclick="exam()">Final assessment</button></p></section><section class="panel"><h2>Important training information</h2><p>All scenarios are fictional. This self-study course does not replace supervision, individualized clinical judgment, official RBT training, or BACB-approved continuing education. Review relevant professional standards before workplace use.</p></section>')}
function lesson(n){state.page=Math.min(35,Math.max(0,n));save();let m=Math.floor(state.page/6),s=state.page%6;render('<section class="panel"><span class="pill">Module '+(m+1)+' · Screen '+(state.page+1)+' of 36</span><h1>'+esc(modules[m][1][s])+'</h1><p style="font-size:20px">'+esc(lessons[m][s])+'</p><div class="notice"><b>Apply it:</b> Think of a fictional session where this principle matters. What observable information would you gather, and who would need to be involved?</div><label for="note"><b>Your practice response</b></label><textarea id="note" placeholder="Write your response here...">'+esc(state.notes[state.page]||"")+'</textarea><p><button class="alt" onclick="lesson('+Math.max(0,state.page-1)+')">← Back</button><button onclick="next()">Save &amp; continue →</button><button class="alt" onclick="home()">Course home</button></p><p style="font-size:13px;color:#566579">Reflections are saved only in this browser. They are not instructor graded.</p></section>')}
function next(){state.notes[state.page]=document.getElementById("note").value;if(!state.done.includes(state.page))state.done.push(state.page);save();if(state.page===35)exam();else lesson(state.page+1)}
function exam(){render('<section class="panel"><span class="pill">Final assessment</span><h1>Check your understanding</h1><p>Answer all 20 questions. You need 16 correct to pass. Three submission attempts are available.</p>'+questions.map((q,i)=>'<section style="border-top:1px solid #ddd;padding:14px 0"><b>'+(i+1)+'. '+esc(q[0])+'</b>'+q[1].map((v,j)=>'<button class="choice '+(state.answers[i]===j?"sel":"")+'" onclick="state.answers['+i+']='+j+';save();exam()">'+String.fromCharCode(65+j)+'. '+esc(v)+'</button>').join('')+'</section>').join('')+'<button onclick="grade()">Submit assessment</button><button class="alt" onclick="home()">Home</button><p id="status" role="status"></p></section>')}
function grade(){if(Object.keys(state.answers).length!==20){document.getElementById("status").textContent="Answer all 20 questions first.";return}if(state.attempts>=3){results();return}state.score=questions.reduce((s,q,i)=>s+(state.answers[i]===q[2]?1:0),0);state.attempts++;save();results()}
function results(){let passed=state.score>=16;render('<section class="panel"><span class="pill">Assessment results</span><h1>'+(passed?"Passed":"Review and retry")+'</h1><h2>'+state.score+'/20 ('+(state.score*5)+'%)</h2><p>Attempts used: '+state.attempts+'/3</p>'+questions.map((q,i)=>'<details style="padding:12px;border-bottom:1px solid #ddd"><summary>'+(i+1)+'. '+esc(q[0])+' — '+(state.answers[i]===q[2]?"Correct":"Review")+'</summary><p>Correct answer: '+esc(q[1][q[2]])+'</p></details>').join('')+(!passed&&state.attempts<3?'<button onclick="state.answers={};save();exam()">Retry assessment</button>':'')+'<button class="alt" onclick="home()">Home</button><button class="alt" onclick="window.print()">Print results</button><p>This is a self-study result, not an approved CE certificate.</p></section>')}
home();
</script><footer class="wrap">© Au-Some Teacher ABA Services · Unlisted means omitted from site navigation and search indexing requests, not password protected.</footer></body></html>
